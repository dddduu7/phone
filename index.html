:root{--bg:#ccd4d8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1113}}
:root[data-theme="dark"]{--bg:#0e1113}
html,body{height:100%;margin:0}
body{background:var(--bg);overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:-apple-system,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
#phone{position:relative;flex:none;width:393px;height:852px;border-radius:56px;overflow:hidden;background:#000;box-shadow:0 0 0 11px #111,0 0 0 13px #4a4a4e,0 30px 70px rgba(0,0,0,.35)}
.scr{position:absolute;inset:0;display:none;flex-direction:column;background:#f1f1f6;color:#111;overflow:hidden}
.scr.on{display:flex;animation:pop .2s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.95)}}

function show(id){$$('.scr').forEach(s=>s.classList.toggle('on',s.id===id));P.classList.toggle('lt',!DARK.includes(id));P.classList.toggle('noback',id==='cal');P.classList.toggle('lk',id==='lock');if(id==='msg')mlist();if(id==='cal')goToday();
 if(id==='pass'){pin='';pd()}}

/* 메시지 */
const UL={},hist={},T=$('#msg .th');let OPEN=null,ADD=null,ntT;
function arrive(n,t){hist[n].push(['them',t]);mlist();if(OPEN===n&&$('#msg.on'))ADD('them',t);else notify(n,t)}
function notify(n,t){const N=$('#ntf');N.innerHTML=`<div class="ic">${ICO.msg}</div><div style="min-width:0"><b>${n}</b><span>${t}</span></div><small>지금</small>`;N.classList.add('on');clearTimeout(ntT);ntT=setTimeout(()=>N.classList.remove('on'),5000);
 N.onclick=()=>{N.classList.remove('on');if(!$('#lock.on,#pass.on')){show('msg');mlist();open(n)}}}
Object.keys(DATA.threads).forEach(n=>hist[n]=DATA.threads[n].start.map(t=>Array.isArray(t)?t:['them',t]));
function mlist(){const ks=Object.keys(DATA.threads).filter(n=>hist[n].length);
 $('#ml').innerHTML=ks.length?ks.map(n=>`<div class="row" data-n="${n}" style="cursor:pointer"><div><b>${n}</b><small>${(hist[n].slice(-1)[0]||[0,''])[1]}</small></div></div>`).join(''):'<div class="empty">대화가 없어요</div>';
 $$('#ml .row').forEach(r=>r.onclick=()=>open(r.dataset.n))}
function open(n){
 T.innerHTML=`<div class="thh"><button data-bk>‹ 목록</button><b>${n}</b><span style="width:50px"></span></div><div class="ms"></div><div class="bar"><button aria-label="추가">＋</button><div class="pill"><input placeholder="iMessage" aria-label="메시지 입력"><button aria-label="보내기">↑</button></div></div>`;
 T.classList.add('on');P.classList.add('noback');
 const M=T.querySelector('.ms'),I=T.querySelector('input'),c=DATA.threads[n];
 const add=(w,t)=>{const d=document.createElement('div');d.className='b '+w;d.textContent=t;M.append(d);M.scrollTop=M.scrollHeight;return d};
 OPEN=n;ADD=add;hist[n].forEach(([w,t])=>add(w,t));
 T.querySelector('[data-bk]').onclick=()=>{T.classList.remove('on');P.classList.remove('noback');OPEN=null;mlist()};
 const reply=async t=>{const r=(c.rules||[]).find(x=>new RegExp(x[0]).test(t)),out=r?r.slice(1).flat():(c.fallback?[c.fallback]:[]);
  for(const o of out){const d=add('them','• • •');d.classList.add('dots');await new Promise(s=>setTimeout(s,900+o.length*40+(c.delay||0)));d.remove();hist[n].push(['them',o]);mlist();if(OPEN===n&&$('#msg.on'))ADD('them',o);else notify(n,o)}if(r&&c.unlocks)UL[c.unlocks]=true};
 const send=()=>{const t=I.value.trim();if(!t)return;I.value='';hist[n].push(['me',t]);add('me',t);reply(t)};
 T.querySelector('.pill button').onclick=send;I.onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing)send()}}
mlist();

const SV={fav:'<svg viewBox="0 0 24 24"><path d="M12 2l3 7 7 .6-5.3 4.7 1.6 7.2L12 17.8 5.7 21.5l1.6-7.2L2 9.6 9 9z"/></svg>',rec:'<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 5v5h4v2h-6V7z"/></svg>',con:'<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 4a3.2 3.2 0 1 1 0 6.4A3.2 3.2 0 0 1 12 6zm0 14a8 8 0 0 1-6-2.7c.5-2 3-3 6-3s5.500 1 6 3A8 8 0 0 1 12 20z"/></svg>',key:'<svg viewBox="0 0 24 24">'+[3,12,21].flatMap(x=>[3,9,15,21].map(y=>`<circle cx="${x}" cy="${y}" r="2.2"/>`)).join('')+'</svg>',vm:'<svg viewBox="0 0 24 24"><path d="M7 7a5 5 0 1 0 0 10h10a5 5 0 1 0 0-10zm0 3a2 2 0 1 1 0 4 2 2 0 0 1 0-4zm10 0a2 2 0 1 1 0 4 2 2 0 0 1 0-4z"/></svg>'};
const TB=[['fav','즐겨찾기'],['rec','최근 통화'],['con','연락처'],['key','키패드']],KL={2:'ABC',3:'DEF',4:'GHI',5:'JKL',6:'MNO',7:'PQRS',8:'TUV',9:'WXYZ',0:'+'},HS='<svg viewBox="0 0 60 60" width="40" height="40"><path d="M18 14c-3 1-5 4-4 8 3 12 12 21 24 24 4 1 7-1 8-4l-1-5-7-2-3 3c-5-2-8-5-10-10l3-3-2-7z" fill="#fff"/></svg>',SRC='<svg viewBox="0 0 24 24" width="28" height="28"><path d="M10 2a8 8 0 1 0 4.9 14.3l5 5 1.4-1.4-5-5A8 8 0 0 0 10 2zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12z"/></svg>';
let tab='key',num='',recent=[{num:'01000000001',type:'out'},{num:'01003100310',type:'miss'},{num:'01000000006',type:'out'}],timers=[];
const fmt=d=>d.length===11?d.replace(/(\d{3})(\d{4})(\d{4})/,'$1-$2-$3'):d;
const nm=n=>{const d=n.replace(/\D/g,''),c=DATA.contacts.find(x=>x.num.replace(/\D/g,'')===d);return c?c.name:fmt(d)};
const rows=(l,sf)=>l.length?`<div class="card">${l.map(c=>`<div class="row" data-d="${c.num}" style="cursor:pointer"><div><b style="${c.type==='miss'?'color:#e8523f':''}">${c.name||nm(c.num)}</b><small>${sf(c)}</small></div></div>`).join('')}</div>`:'<div class="card"></div>';
function phone(){const V=$('#pv');
 $('#tabs').innerHTML='<div class="tp">'+TB.map(([k,n])=>`<button data-t="${k}" class="${k===tab?'sel':''}">${SV[k]}${n}</button>`).join('')+'</div><button class="sq" aria-label="검색">'+SRC+'</button>';
 $$('#tabs .tp button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;phone()});
 if(tab==='key'){V.innerHTML=`<div id="disp">${fmt(num)}</div><div class="kp">${'123456789*0#'.split('').map(k=>`<button data-k="${k}">${k}<small>${KL[k]||''}</small></button>`).join('')}<button class="go" data-go aria-label="전화 걸기">${HS}</button>${num?'<button class="del" data-del aria-label="지우기">⌫</button>':''}</div>`;
  V.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{if(num.length<11){num+=b.dataset.k;phone()}});
  const dl=V.querySelector('[data-del]');if(dl)dl.onclick=()=>{num=num.slice(0,-1);phone()};V.querySelector('[data-go]').onclick=()=>dial(num);return}
 const H={fav:['즐겨찾기',rows(DATA.contacts.filter(c=>c.fav),()=>'휴대전화')],rec:['최근 통화',rows(recent,c=>c.type==='miss'?'부재중 전화':c.type==='in'?'수신 전화':'발신 전화')],con:['연락처',rows(DATA.contacts,()=>'휴대전화')]}[tab];
 V.innerHTML=`<div class="hd">${H[0]}</div>${H[1]}`;V.querySelectorAll('[data-d]').forEach(r=>r.onclick=()=>dial(r.dataset.d))}
phone();
function dial(raw){const d=raw.replace(/\D/g,'');if(!d)return;
 const c=DATA.contacts.find(x=>x.num.replace(/\D/g,'')===d),lines=Object.values(DATA.threads).some(t=>t.unlocks===d)&&!UL[d]?null:DATA.calls[d];recent.unshift({num:d,type:'out'});
 $('#cn').textContent=c&&c.name?c.name:fmt(d);$('#cs').textContent='발신 중…';$('#sub').innerHTML='';show('call');
 const at=(f,ms)=>timers.push(setTimeout(f,ms));
 if(!lines){at(()=>{$('#cs').textContent=(c?'받지 않아요':'연결할 수 없는 번호예요');at(endCall,2200)},1800);return}
 let s=0;at(()=>{timers.push(setInterval(()=>{s++;$('#cs').textContent=`통화 중 ${Math.floor(s/60)}:${z(s%60)}`},1000));
  lines.forEach((l,i)=>at(()=>{const p=document.createElement('p');p.textContent=l;$('#sub').append(p);while($('#sub').children.length>3)$('#sub').firstChild.remove()},800+i*3200));
  at(done,800+lines.length*3200+1200)},1800)}
function done(){timers.forEach(t=>{clearTimeout(t);clearInterval(t)});timers=[];num='';$('#cs').textContent='전화 끊김';$('#call').classList.add('done');timers.push(setTimeout(endCall,1600))}
function endCall(){timers.forEach(t=>{clearTimeout(t);clearInterval(t)});timers=[];const C=$('#call');C.classList.remove('done');if(C.classList.contains('ring')){C.classList.remove('ring');recent.unshift({num:IN.num,type:'miss'})}num='';phone();show(retTo);retTo='ph'}
$('#end').onclick=endCall;
let retTo='ph',started=false;
const IN={num:'01001230123',lines:['야 너 누구야','내 폰 내놓라','어디야','어디세요?','백도형인가?']};
function ring(){const on=$('.scr.on');if(!on||['call','lock','pass'].includes(on.id)){setTimeout(ring,8000);return}
 retTo=on.id;$('#cn').textContent=nm(IN.num);$('#cs').textContent='휴대전화';$('#sub').innerHTML='';$('#call').classList.add('ring');show('call');
 timers.push(setTimeout(()=>{if($('#call').classList.contains('ring'))endCall()},30000))}
function play(lines){const at=(f,ms)=>timers.push(setTimeout(f,ms));let s=0;
 timers.push(setInterval(()=>{s++;$('#cs').textContent=`통화 중 ${Math.floor(s/60)}:${z(s%60)}`},1000));
 lines.forEach((l,i)=>at(()=>{const p=document.createElement('p');p.textContent=l;$('#sub').append(p);while($('#sub').children.length>3)$('#sub').firstChild.remove()},600+i*3000));
 at(done,600+lines.length*3000+1000)}
$('#acc').innerHTML=HS;$('#acc').onclick=()=>{$('#call').classList.remove('ring');recent.unshift({num:IN.num,type:'in'});$('#cs').textContent='통화 중 0:00';play(IN.lines)};

let cnt=0;function pc(){$('#pc2').textContent=cnt+'장의 사진'}
PHOTOS.forEach(u=>{const i=new Image();i.src=u;$('#pg').append(i);cnt++});pc();
$('#pa').onclick=()=>$('#pf').click();
$('#pf').onchange=e=>{[...e.target.files].forEach(f=>{const i=new Image();i.src=URL.createObjectURL(f);$('#pg').append(i);cnt++});pc();e.target.value=''};

/* 사진 크게 보기 */
let vi=0;
function vshow(i){const L=[...$('#pg').children];if(i<0||i>=L.length)return;vi=i;$('#vi').src=L[i].src;$('#vn').textContent=`${i+1} / ${L.length}`;
 $('#vp').style.visibility=i>0?'visible':'hidden';$('#vq').style.visibility=i<L.length-1?'visible':'hidden';$('#vw').classList.add('on');P.classList.add('vwr')}
$('#pg').onclick=e=>{if(e.target.tagName==='IMG')vshow([...$('#pg').children].indexOf(e.target))};
$('#vb').onclick=()=>{$('#vw').classList.remove('on');P.classList.remove('vwr')};
$('#vp').onclick=()=>vshow(vi-1);$('#vq').onclick=()=>vshow(vi+1);
let vx=0;$('#vw').onpointerdown=e=>vx=e.clientX;
$('#vw').onpointerup=e=>{const d=e.clientX-vx;if(d>50)vshow(vi-1);else if(d<-50)vshow(vi+1)};
addEventListener('keydown',e=>{if($('#vw.on')){if(e.key==='ArrowLeft')vshow(vi-1);if(e.key==='ArrowRight')vshow(vi+1)}});
/* 캘린더 */
function cal(){const t=new Date(),tk=t.getFullYear()+'-'+(t.getMonth()+1)+'-'+t.getDate(),Y=2026;let h='';
 for(let m=1;m<=12;m++){const f=new Date(Y,m-1,1).getDay(),n=new Date(Y,m,0).getDate(),e=(7-(f+n)%7)%7;
  h+=`<div id="mo${m}"><div class="ml">${m}월</div><div class="mg">`+'<div class="dc"></div>'.repeat(f)+Array.from({length:n},(_,i)=>{const k=`${Y}-${m}-${i+1}`,ev=DATA.events[k];
   return `<div class="dc" data-k="${k}"><span class="dn ${k===tk?'t':''}">${i+1}</span>${ev?`<i class="dt ${ev.some(x=>x[1])?'r':''}"></i>`:''}</div>`}).join('')+'<div class="dc"></div>'.repeat(e)+'</div></div>'}
 $('#cscr').innerHTML=h}
function goToday(){const t=new Date(),m=$('#mo'+(t.getFullYear()===2026?t.getMonth()+1:10));$('#cscr').scrollTop=m?m.offsetTop-4:0}
$('#cscr').onclick=e=>{const c=e.target.closest('.dc[data-k]');if(!c)return;const k=c.dataset.k,[y,m,d]=k.split('-').map(Number),ev=DATA.events[k]||[];
 $('#csh').innerHTML=`<div class="shc"><button class="shx" aria-label="닫기">✕</button><b>${m}월 ${d}일 ${WK[new Date(y,m-1,d).getDay()]}요일</b>${ev.length?ev.map(x=>`<div class="se"><i class="dt ${x[1]?'r':''}"></i>${x[0]}</div>`).join(''):'<div class="sn">일정이 없어요</div>'}</div>`;$('#csh').classList.add('on')};
$('#csh').onclick=e=>{if(e.target.id==='csh'||e.target.closest('.shx'))$('#csh').classList.remove('on')};
$('#cb').onclick=home;$('#ct2').onclick=goToday;cal();

function fit(){$('#frame').style.transform=`scale(${Math.min(1,(innerWidth-30)/419,(innerHeight-30)/880)})`}
fit();addEventListener('resize',fit);
</script></body></html>
